<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日候選股手記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE6DC;
    --paper-raised: #F1EDE2;
    --ink: #24261F;
    --ink-soft: #55574A;
    --rule: #C9C2AE;
    --rule-dark: #A79F87;
    --value: #3D5A3D;
    --value-bg: #E1E6D8;
    --growth: #A8461F;
    --growth-bg: #F3DFCF;
    --dividend: #2E4374;
    --dividend-bg: #DCE2EE;
    --gold: #A6791F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 42px;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    padding-top: 44px;
    padding-bottom: 28px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }

  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 42px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .masthead .sub {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .meta {
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .meta .date {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }

  .filters {
    display: flex;
    gap: 10px;
    padding: 20px 0;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    background: transparent;
    cursor: pointer;
    color: var(--ink);
    transition: all .15s ease;
    white-space: nowrap;
  }
  .chip:hover { background: rgba(36,38,31,0.06); }
  .chip.active { background: var(--ink); color: var(--paper); }

  .entry {
    position: relative;
    border-bottom: 1px solid var(--rule-dark);
    padding: 22px 4px 22px 4px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px 24px;
    align-items: center;
  }

  .entry:hover { background: var(--paper-raised); }

  .id-block .rank {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .id-block h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 2px 0 3px;
  }

  .id-block .ticker-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .id-block .ticker-line .mkt {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--rule-dark);
    border-radius: 3px;
    margin-right: 6px;
    font-size: 10.5px;
  }

  .scores {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 190px;
  }

  .score-row {
    display: grid;
    grid-template-columns: 34px 1fr 30px;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
  }

  .score-row .lbl { color: var(--ink-soft); }
  .score-row .val { text-align: right; font-weight: 600; }

  .bar-track {
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-fill.value { background: var(--value); }
  .bar-fill.growth { background: var(--growth); }
  .bar-fill.dividend { background: var(--dividend); }

  .composite {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--gold);
    text-align: right;
  }
  .composite .lbl {
    display: block;
    font-size: 9.5px;
    color: var(--ink-soft);
    font-weight: 400;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .stamp {
    position: absolute;
    top: 18px;
    right: -6px;
    transform: rotate(-7deg);
    border: 2px solid;
    border-radius: 6px;
    padding: 3px 9px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    opacity: 0.92;
    white-space: nowrap;
  }
  .stamp.長期 { color: var(--dividend); border-color: var(--dividend); background: var(--dividend-bg); }
  .stamp.短中期 { color: var(--growth); border-color: var(--growth); background: var(--growth-bg); }
  .stamp.中長期 { color: var(--value); border-color: var(--value); background: var(--value-bg); }
  .stamp.中期 { color: var(--ink-soft); border-color: var(--rule-dark); background: var(--paper-raised); }

  footer {
    max-width: 920px;
    margin: 40px auto 0;
    padding: 0 24px;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.9;
  }

  .disclaimer {
    border-left: 3px solid var(--gold);
    padding: 10px 16px;
    background: var(--paper-raised);
    margin-top: 24px;
  }

  @media (max-width: 640px) {
    .masthead h1 { font-size: 30px; }
    header { flex-direction: column; align-items: flex-start; }
    .meta { text-align: left; }
    .entry { grid-template-columns: 1fr; }
    .composite { text-align: left; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="masthead">
      <h1>每日候選股手記</h1>
      <div class="sub">價值 · 成長 · 股息 &nbsp;三合一評分 &nbsp;/&nbsp; 台股 + 美股</div>
    </div>
    <div class="meta">
      <div class="date" id="updated-date">—</div>
      <div id="scanned-count">掃描中…</div>
    </div>
  </header>

  <div class="filters" id="filters"></div>

  <div id="list"></div>
</div>

<footer>
  <div class="disclaimer">
    本清單為程式依公開財務數據自動計算之參考排名，並非投資建議。分數與持有期間建議僅反映歷史財報特徵，不代表未來績效，請自行判斷並承擔投資風險。
  </div>
</footer>

<script>
const SAMPLE_DATA = {"updated_at": "2026-08-21T08:00:00", "total_scanned": 150, "note": "此為示範資料，正式啟用排程後會被每日真實資料自動取代", "top_picks": [{"ticker": "2882.TW", "name": "國泰金", "market": "TW", "price": 58.4, "pe": 11.2, "pb": 1.3, "roe": 0.14, "revenue_growth": 0.06, "earnings_growth": 0.09, "dividend_yield": 0.052, "payout_ratio": 0.62, "beta": 0.85, "sector": "Financials", "value_score": 78.2, "growth_score": 54.1, "dividend_score": 81.3, "composite_score": 71.2, "horizon": "長期 (適合存股領息)"}, {"ticker": "2330.TW", "name": "台積電", "market": "TW", "price": 1105, "pe": 21.4, "pb": 6.8, "roe": 0.28, "revenue_growth": 0.24, "earnings_growth": 0.31, "dividend_yield": 0.016, "payout_ratio": 0.55, "beta": 1.15, "sector": "Technology", "value_score": 58.6, "growth_score": 92.4, "dividend_score": 41.2, "composite_score": 64.1, "horizon": "短中期 (波動較大，成長動能為主)"}, {"ticker": "AVGO", "name": "Broadcom Inc.", "market": "US", "price": 248.3, "pe": 32.1, "pb": 14.2, "roe": 0.31, "revenue_growth": 0.19, "earnings_growth": 0.22, "dividend_yield": 0.014, "payout_ratio": 0.45, "beta": 1.22, "sector": "Technology", "value_score": 49.3, "growth_score": 88.7, "dividend_score": 38.5, "composite_score": 58.8, "horizon": "短中期 (波動較大，成長動能為主)"}, {"ticker": "2891.TW", "name": "中信金", "market": "TW", "price": 34.2, "pe": 9.8, "pb": 1.1, "roe": 0.13, "revenue_growth": 0.05, "earnings_growth": 0.07, "dividend_yield": 0.058, "payout_ratio": 0.58, "beta": 0.79, "sector": "Financials", "value_score": 81.5, "growth_score": 47.3, "dividend_score": 85.9, "composite_score": 71.6, "horizon": "長期 (適合存股領息)"}, {"ticker": "JNJ", "name": "Johnson & Johnson", "market": "US", "price": 162.1, "pe": 15.6, "pb": 5.1, "roe": 0.24, "revenue_growth": 0.04, "earnings_growth": 0.06, "dividend_yield": 0.031, "payout_ratio": 0.48, "beta": 0.55, "sector": "Healthcare", "value_score": 68.9, "growth_score": 40.2, "dividend_score": 72.6, "composite_score": 60.6, "horizon": "長期 (適合存股領息)"}, {"ticker": "1301.TW", "name": "台塑", "market": "TW", "price": 56.7, "pe": 18.3, "pb": 0.95, "roe": 0.06, "revenue_growth": -0.03, "earnings_growth": -0.08, "dividend_yield": 0.035, "payout_ratio": 0.9, "beta": 0.72, "sector": "Materials", "value_score": 66.4, "growth_score": 22.1, "dividend_score": 55.3, "composite_score": 47.9, "horizon": "中長期 (等待價值回歸)"}, {"ticker": "MSFT", "name": "Microsoft Corp", "market": "US", "price": 512.8, "pe": 34.7, "pb": 11.9, "roe": 0.35, "revenue_growth": 0.15, "earnings_growth": 0.18, "dividend_yield": 0.007, "payout_ratio": 0.25, "beta": 0.9, "sector": "Technology", "value_score": 41.2, "growth_score": 76.5, "dividend_score": 29.8, "composite_score": 49.2, "horizon": "短中期 (波動較大，成長動能為主)"}, {"ticker": "2412.TW", "name": "中華電", "market": "TW", "price": 124.5, "pe": 24.6, "pb": 2.7, "roe": 0.11, "revenue_growth": 0.02, "earnings_growth": 0.03, "dividend_yield": 0.045, "payout_ratio": 0.95, "beta": 0.28, "sector": "Communication", "value_score": 38.7, "growth_score": 18.4, "dividend_score": 66.2, "composite_score": 41.1, "horizon": "長期 (適合存股領息)"}, {"ticker": "KO", "name": "Coca-Cola Co", "market": "US", "price": 71.4, "pe": 24.1, "pb": 10.8, "roe": 0.42, "revenue_growth": 0.06, "earnings_growth": 0.08, "dividend_yield": 0.028, "payout_ratio": 0.68, "beta": 0.6, "sector": "Consumer Staples", "value_score": 35.6, "growth_score": 48.9, "dividend_score": 63.1, "composite_score": 49.2, "horizon": "中期 (可觀察為主)"}, {"ticker": "2308.TW", "name": "台達電", "market": "TW", "price": 412, "pe": 26.8, "pb": 5.4, "roe": 0.19, "revenue_growth": 0.13, "earnings_growth": 0.17, "dividend_yield": 0.021, "payout_ratio": 0.5, "beta": 1.05, "sector": "Technology", "value_score": 44.8, "growth_score": 71.3, "dividend_score": 44.7, "composite_score": 53.6, "horizon": "中期 (可觀察為主)"}]};

const HORIZON_KEY = h => h.split(' ')[0].replace(/[()（）]/g,'');

async function loadData() {
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data.json');
    return await res.json();
  } catch (e) {
    return SAMPLE_DATA;
  }
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (週${days[d.getDay()]})`;
}

function render(data, filterMkt, filterHorizon) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  let picks = data.top_picks.slice();

  if (filterMkt !== 'ALL') picks = picks.filter(p => p.market === filterMkt);
  if (filterHorizon !== 'ALL') picks = picks.filter(p => HORIZON_KEY(p.horizon) === filterHorizon);

  picks.forEach((p, i) => {
    const entry = document.createElement('div');
    entry.className = 'entry';
    const hKey = HORIZON_KEY(p.horizon);
    entry.innerHTML = `
      <div class="stamp ${hKey}">${p.horizon}</div>
      <div class="id-block">
        <div class="rank">NO. ${String(i+1).padStart(2,'0')}</div>
        <h2>${p.name}</h2>
        <div class="ticker-line"><span class="mkt">${p.market}</span>${p.ticker} · ${p.sector || '—'}</div>
      </div>
      <div class="scores">
        <div class="score-row">
          <span class="lbl">價值</span>
          <span class="bar-track"><span class="bar-fill value" style="width:${p.value_score}%"></span></span>
          <span class="val">${p.value_score}</span>
        </div>
        <div class="score-row">
          <span class="lbl">成長</span>
          <span class="bar-track"><span class="bar-fill growth" style="width:${p.growth_score}%"></span></span>
          <span class="val">${p.growth_score}</span>
        </div>
        <div class="score-row">
          <span class="lbl">股息</span>
          <span class="bar-track"><span class="bar-fill dividend" style="width:${p.dividend_score}%"></span></span>
          <span class="val">${p.dividend_score}</span>
        </div>
      </div>
      <div class="composite">
        <span class="lbl">綜合分數</span>
        ${p.composite_score}
      </div>
    `;
    list.appendChild(entry);
  });

  if (picks.length === 0) {
    list.innerHTML = '<div style="padding:40px 4px;color:var(--ink-soft);font-family:\'IBM Plex Mono\',monospace;font-size:13px;">此篩選條件下暫無候選股</div>';
  }
}

(async () => {
  const data = await loadData();
  document.getElementById('updated-date').textContent = fmtDate(data.updated_at);
  document.getElementById('scanned-count').textContent = `本次共掃描 ${data.total_scanned} 檔`;

  let filterMkt = 'ALL';
  let filterHorizon = 'ALL';

  const filtersEl = document.getElementById('filters');
  const mktChips = [['ALL','全部市場'],['TW','台股'],['US','美股']];
  const hChips = [['ALL','全部期間'],['長期','長期'],['中長期','中長期'],['中期','中期'],['短中期','短中期']];

  function buildChips() {
    filtersEl.innerHTML = '';
    mktChips.forEach(([key,label]) => {
      const c = document.createElement('button');
      c.className = 'chip' + (filterMkt===key?' active':'');
      c.textContent = label;
      c.onclick = () => { filterMkt = key; buildChips(); render(data, filterMkt, filterHorizon); };
      filtersEl.appendChild(c);
    });
    const divider = document.createElement('span');
    divider.style.cssText = 'width:1px;background:var(--rule-dark);margin:4px 6px;';
    filtersEl.appendChild(divider);
    hChips.forEach(([key,label]) => {
      const c = document.createElement('button');
      c.className = 'chip' + (filterHorizon===key?' active':'');
      c.textContent = label;
      c.onclick = () => { filterHorizon = key; buildChips(); render(data, filterMkt, filterHorizon); };
      filtersEl.appendChild(c);
    });
  }

  buildChips();
  render(data, filterMkt, filterHorizon);
})();
</script>

</body>
</html>
